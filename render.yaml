services:
  - type: web
    name: evolutia-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evolutia-db
          property: connectionString
      - key: EVOLUTIA_ADMIN_TOKEN
        sync: false

databases:
  - name: evolutia-db
    plan: free
